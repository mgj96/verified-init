[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-init"
version = "0.1.0"
description = "Generate a CLAUDE.md that contains only claims it can prove. No model, no network, no tokens."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
    "agents.md",
    "ai-agents",
    "claude-code",
    "codex",
    "cursor",
    "copilot",
    "context",
    "documentation-drift",
    "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately empty: the standard library is the whole dependency list.
dependencies = []

[project.urls]
Homepage = "https://github.com/mgj96/verified-init"
Issues = "https://github.com/mgj96/verified-init/issues"

[project.scripts]
verified-init = "verified_init.cli:main"

[tool.setuptools]
packages = ["verified_init", "verified_init.detectors"]
